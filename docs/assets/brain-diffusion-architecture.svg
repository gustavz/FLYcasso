<rect width="600" height="530" fill="#fbefe7"/>

            <title id="diffusion-diagram-title">Fly-conditioned image U-Net and DDIM sampler</title>
            <desc id="diffusion-diagram-desc">Noisy RGB image enters the encoder. Image features, category and timestep enter the full fly circuit. Its readout conditions the decoder, alongside encoder skip connections. The clean-image estimate enters DDIM, which feeds the next noisy state back into the encoder or returns the final image.</desc>
            <defs>
            <marker id="diffusion-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <path d="M0 0 7 3.5 0 7Z" fill="currentColor"/>
            </marker>
            </defs>
            <g class="node">
            <rect x="20" y="20" width="140" height="62"/>
            <text x="90.0" y="44" text-anchor="middle" class="node-title">Noisy image</text>
            <text x="90.0" y="66" text-anchor="middle">3 × 32 × 32</text>
            </g>
            <g class="node">
            <rect x="220" y="20" width="180" height="62"/>
            <text x="310.0" y="44" text-anchor="middle" class="node-title">Conditioning</text>
            <text x="310.0" y="66" text-anchor="middle">Category + timestep</text>
            </g>
            <g class="node">
            <rect x="20" y="150" width="140" height="100"/>
            <text x="90.0" y="174" text-anchor="middle" class="node-title">2D encoder</text>
            <text x="90.0" y="196" text-anchor="middle">32² → 8²</text>
            <text x="90.0" y="215" text-anchor="middle">32 → 128 ch.</text>
            </g>
            <g class="node circuit">
            <rect x="220" y="150" width="180" height="100"/>
            <text x="310.0" y="174" text-anchor="middle" class="node-title">Full fly circuit</text>
            <text x="310.0" y="196" text-anchor="middle">166,700 neurons</text>
            <text x="310.0" y="215" text-anchor="middle">128 → N → 128</text>
            </g>
            <g class="node">
            <rect x="460" y="150" width="120" height="100"/>
            <text x="520.0" y="174" text-anchor="middle" class="node-title">Decoder</text>
            <text x="520.0" y="196" text-anchor="middle">8² → 32²</text>
            <text x="520.0" y="215" text-anchor="middle">ResNet · attn.</text>
            </g>
            <path class="edge" d="M90 82V150" marker-end="url(#diffusion-arrow)"/>
            <path class="edge" d="M310 82V150" marker-end="url(#diffusion-arrow)"/>
            <path class="edge" d="M160 202H220" marker-end="url(#diffusion-arrow)"/>
            <path class="edge" d="M400 202H460" marker-end="url(#diffusion-arrow)"/>
            <text class="edge-label" x="406" y="191">Context</text>
            <path class="edge skip" d="M155 165H180V110H520V150" marker-end="url(#diffusion-arrow)"/>
            <text class="edge-label" x="376" y="101">Encoder skips</text>
            <path class="edge" d="M352 155V130H422V231H400" marker-end="url(#diffusion-arrow)"/>
            <text class="edge-label" x="426" y="148">×3</text>
            <g class="node">
            <rect x="440" y="295" width="140" height="65"/>
            <text x="510.0" y="319" text-anchor="middle" class="node-title">x₀ estimate</text>
            <text x="510.0" y="341" text-anchor="middle">3 × 32 × 32</text>
            </g>
            <path class="edge" d="M520 250V295" marker-end="url(#diffusion-arrow)"/>
            <g class="node sample">
            <rect x="220" y="390" width="180" height="75"/>
            <text x="310.0" y="414" text-anchor="middle" class="node-title">DDIM</text>
            <text x="310.0" y="436" text-anchor="middle">50 steps · CFG 2</text>
            </g>
            <path class="edge" d="M510 360V375H310V390" marker-end="url(#diffusion-arrow)"/>
            <g class="node">
