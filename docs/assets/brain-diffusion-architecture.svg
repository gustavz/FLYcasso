            <text x="520.0" y="421" text-anchor="middle" class="node-title">RGB image</text>
            <text x="520.0" y="443" text-anchor="middle">32 × 32</text>
            </g>
            <path class="edge" d="M400 428H460" marker-end="url(#diffusion-arrow)"/>
            <text class="edge-label" x="409" y="418">t = 0</text>
            <path class="edge skip" d="M220 428H180V50H160" marker-end="url(#diffusion-arrow)"/>
            <text class="edge-label" x="186" y="350">Next xₜ</text>
            <text x="20" y="510" class="edge-label">Residual blocks · 8 × 8 spatial attention · encoder skips</text>
