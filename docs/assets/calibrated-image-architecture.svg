<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 530" role="img" aria-labelledby="title desc"><title id="title">Circuit-first image architecture</title><desc id="desc">Noisy image · category · time · seed 16 → 32 pixel curriculum. Calibrated optic-lobe electrodes L1 / L2 / L5 + visual-feedback cues. MaleCNS recurrent circuit 166,700 neurons · 25,582,938 edges. Local linear neural readout 9 visual cell types → RGB · shared 1×1 map. DDIM update 8 denoising steps × 8 neural ticks. Synaptic gains, biases and leak rates are learned. Local interface calibration is learned.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#191613"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#191613;font-size:15px}.title{font-size:18px;font-weight:bold}.arrow{stroke:#191613;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="600" height="530" fill="#fff8ef"/><rect x="80" y="15" width="450" height="72" fill="#fff8ef" stroke="#191613" stroke-width="2"/><text x="305" y="42" class="title" text-anchor="middle">Noisy image · category · time · seed</text><text x="305" y="66" text-anchor="middle">16 → 32 pixel curriculum</text><path class="arrow" d="M305 87v24"/><rect x="80" y="111" width="450" height="72" fill="#fff8ef" stroke="#191613" stroke-width="2"/><text x="305" y="138" class="title" text-anchor="middle">Calibrated optic-lobe electrodes</text><text x="305" y="162" text-anchor="middle">L1 / L2 / L5 + visual-feedback cues</text><path class="arrow" d="M305 183v24"/><rect x="80" y="207" width="450" height="72" fill="#9dafd8" stroke="#191613" stroke-width="2"/><text x="305" y="234" class="title" text-anchor="middle">MaleCNS recurrent circuit</text><text x="305" y="258" text-anchor="middle">166,700 neurons · 25,582,938 edges</text><path class="arrow" d="M305 279v24"/><rect x="80" y="303" width="450" height="72" fill="#fff8ef" stroke="#191613" stroke-width="2"/><text x="305" y="330" class="title" text-anchor="middle">Local linear neural readout</text><text x="305" y="354" text-anchor="middle">9 visual cell types → RGB · shared 1×1 map</text><path class="arrow" d="M305 375v24"/><rect x="80" y="399" width="450" height="72" fill="#fff8ef" stroke="#191613" stroke-width="2"/><text x="305" y="426" class="title" text-anchor="middle">DDIM update</text><text x="305" y="450" text-anchor="middle">8 denoising steps × 8 neural ticks</text><path class="arrow" d="M80 438H35V50H80"/><text x="24" y="330" transform="rotate(-90 24 330)">Feedback each step</text><path class="arrow" d="M530 233h35v37h-35"/><text x="300" y="516" text-anchor="middle">Shared cell-type gains · local learned calibration</text></svg>