            <title id="motor-diagram-title">Stroke diffusion and closed-loop leg control</title>
            <desc id="motor-diagram-desc">Noisy strokes enter the encoder. Category and timestep enter the full fly circuit, which conditions the decoder; encoder features also skip to the decoder. DDIM produces a path. Observations and path targets feed the learned controller through the same frozen circuit. Joint corrections drive MuJoCo, which returns state observations and records pen contact.</desc>
            <defs>
            <marker id="motor-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <path d="M0 0 7 3.5 0 7Z" fill="currentColor"/>
            </marker>
            </defs>
            <g class="node">
            <rect x="20" y="20" width="140" height="62"/>
            <text x="90.0" y="44" text-anchor="middle" class="node-title">Noisy strokes</text>
            <text x="90.0" y="66" text-anchor="middle">3 × 256</text>
            </g>
            <g class="node">
            <rect x="220" y="20" width="180" height="62"/>
            <text x="310.0" y="44" text-anchor="middle" class="node-title">Conditioning</text>
            <text x="310.0" y="66" text-anchor="middle">Category + timestep</text>
            </g>
            <g class="node">
            <rect x="20" y="150" width="140" height="100"/>
            <text x="90.0" y="174" text-anchor="middle" class="node-title">1D encoder</text>
            <text x="90.0" y="196" text-anchor="middle">256 → 16</text>
            <text x="90.0" y="215" text-anchor="middle">32 → 64 ch.</text>
            </g>
            <g class="node circuit">
            <rect x="220" y="150" width="180" height="100"/>
            <text x="310.0" y="174" text-anchor="middle" class="node-title">Full fly circuit</text>
            <text x="310.0" y="196" text-anchor="middle">166,700 neurons</text>
            <text x="310.0" y="215" text-anchor="middle">64 → N → 64</text>
            </g>
            <g class="node">
            <rect x="460" y="150" width="120" height="100"/>
            <text x="520.0" y="174" text-anchor="middle" class="node-title">Decoder</text>
            <text x="520.0" y="196" text-anchor="middle">16 → 256</text>
            <text x="520.0" y="215" text-anchor="middle">GN · SiLU</text>
            </g>
            <path class="edge" d="M90 82V150" marker-end="url(#motor-arrow)"/>
            <path class="edge" d="M310 82V150" marker-end="url(#motor-arrow)"/>
