<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 530" role="img" aria-labelledby="title desc"><title id="title">Circuit-first motor architecture</title><desc id="desc">Own canvas · category · clock · seed 7 joint positions + 7 velocities. Fixed sensory electrodes Optic / proprioceptive + descending inputs. MaleCNS recurrent circuit Brain + VNC · persistent episode state. Annotated LF motor pools Fixed pooling → 15 muscle activations. FlyMimic / MuJoCo Muscle forces → contact ink → feedback. Synaptic gains, biases and leak rates are learned. Interfaces are fixed.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#191613"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#191613;font-size:15px}.title{font-size:18px;font-weight:bold}.arrow{stroke:#191613;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="600" height="530" fill="#fff8ef"/><rect x="80" y="15" width="450" height="72" fill="#fff8ef" stroke="#191613" stroke-width="2"/><text x="305" y="42" class="title" text-anchor="middle">Own canvas · category · clock · seed</text><text x="305" y="66" text-anchor="middle">7 joint positions + 7 velocities</text><path class="arrow" d="M305 87v24"/><rect x="80" y="111" width="450" height="72" fill="#fff8ef" stroke="#191613" stroke-width="2"/><text x="305" y="138" class="title" text-anchor="middle">Fixed sensory electrodes</text><text x="305" y="162" text-anchor="middle">Optic / proprioceptive + descending inputs</text><path class="arrow" d="M305 183v24"/><rect x="80" y="207" width="450" height="72" fill="#df6759" stroke="#191613" stroke-width="2"/><text x="305" y="234" class="title" text-anchor="middle">MaleCNS recurrent circuit</text><text x="305" y="258" text-anchor="middle">Brain + VNC · persistent episode state</text><path class="arrow" d="M305 279v24"/><rect x="80" y="303" width="450" height="72" fill="#fff8ef" stroke="#191613" stroke-width="2"/><text x="305" y="330" class="title" text-anchor="middle">Annotated LF motor pools</text><text x="305" y="354" text-anchor="middle">Fixed pooling → 15 muscle activations</text><path class="arrow" d="M305 375v24"/><rect x="80" y="399" width="450" height="72" fill="#fff8ef" stroke="#191613" stroke-width="2"/><text x="305" y="426" class="title" text-anchor="middle">FlyMimic / MuJoCo</text><text x="305" y="450" text-anchor="middle">Muscle forces → contact ink → feedback</text><path class="arrow" d="M80 438H35V50H80"/><text x="24" y="330" transform="rotate(-90 24 330)">Feedback each step</text><path class="arrow" d="M530 233h35v37h-35"/><text x="300" y="516" text-anchor="middle">Learned synapses and dynamics · fixed interfaces</text></svg>